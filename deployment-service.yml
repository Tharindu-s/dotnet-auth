# Secrets are read from a Kubernetes secret named dotnet-auth-secrets. Create it first:
#
#   openssl genrsa -out signing-key.pem 2048
#   kubectl create secret generic dotnet-auth-secrets -n dotnet-authentication \
#     --from-literal=ConnectionStrings__DefaultConnection='Host=...;Database=...;Username=...;Password=...' \
#     --from-literal=Security__ApiKeySalt="$(openssl rand -base64 32)" \
#     --from-literal=Argus__AdminEmail='you@example.com' \
#     --from-literal=Argus__AdminPassword='<initial admin password, changed at first sign-in>' \
#     --from-file=JWT__PrivateKey=signing-key.pem
#
# Optional SMTP for welcome emails: add EmailSettings__From, EmailSettings__Username and EmailSettings__Password.
#
# Every replica loads the same signing key, so tokens survive restarts and validate on any pod.
# On start, the API applies migrations (EF Core takes a lock, so replicas don't race) and creates
# the Argus app and its first admin if they don't exist.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dotnet-auth
  namespace: dotnet-authentication
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dotnet-auth
  template:
    metadata:
      labels:
        app: dotnet-auth
    spec:
      containers:
        - name: my-app-container
          image: tharindu007/dotnet-auth:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: dotnet-auth-secrets
          env:
            - name: Database__MigrateOnStartup
              value: "true"
            # The URL users open Argus at. Set it to your real host.
            - name: Argus__AllowedOrigins__0
              value: https://argus.example.com
            # Trust X-Forwarded-For from inside the cluster (the frontend's nginx).
            # Match this to your cluster's pod network.
            - name: ForwardedHeaders__KnownNetworks__0
              value: 10.0.0.0/8
---
apiVersion: v1
kind: Service
metadata:
  name: dotnet-auth
  namespace: dotnet-authentication
spec:
  selector:
    app: dotnet-auth
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: LoadBalancer
---
# Argus, the admin console: nginx serving the static build and proxying /api to the service above,
# so the browser sees one origin.
#   docker build -t tharindu007/dotnet-auth-frontend:latest frontend
# Argus__AllowedOrigins above must match the URL users open, and TLS must terminate
# in front of it, because the refresh cookie is Secure.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dotnet-auth-frontend
  namespace: dotnet-authentication
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dotnet-auth-frontend
  template:
    metadata:
      labels:
        app: dotnet-auth-frontend
    spec:
      containers:
        - name: frontend
          image: tharindu007/dotnet-auth-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: API_UPSTREAM
              value: http://dotnet-auth:8080
---
apiVersion: v1
kind: Service
metadata:
  name: dotnet-auth-frontend
  namespace: dotnet-authentication
spec:
  selector:
    app: dotnet-auth-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: LoadBalancer
